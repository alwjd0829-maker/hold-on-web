workflows:
  hold-on-rebuild-final-testflight:
    name: HOLD ON Rebuild — Functional TestFlight

    integrations:
      app_store_connect: HOLD ON Codemagic

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - HOLD_ON_APP_STORE_BUILD10
          - HOLD_ON_CONTROLS_APP_STORE_BUILD10
        certificates:
          - HOLD ON Distribution
      vars:
        XCODE_PROJECT: "HoldOnRebuild.xcodeproj"
        XCODE_SCHEME: "HoldOnRebuild"

    scripts:
      - name: Preflight native functional rebuild
        script: |
          set -euo pipefail
          PROJECT_FILE="$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          test -f "$PROJECT_FILE"
          test -f "$CM_BUILD_DIR/HoldOnRebuild/Engine/AudioHoldEngine.swift"
          python3 "$CM_BUILD_DIR/Validation/verify_build160.py"
          FONT_DIR="$CM_BUILD_DIR/HoldOnRebuild/Fonts"
          mkdir -p "$FONT_DIR"
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/yangheeryu/Gowun-Batang/master/fonts/ttf/GowunBatang-Regular.ttf" \
            --output "$FONT_DIR/GowunBatang-Regular.ttf"
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/yangheeryu/Gowun-Batang/master/fonts/ttf/GowunBatang-Bold.ttf" \
            --output "$FONT_DIR/GowunBatang-Bold.ttf"
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/yangheeryu/Gowun-Batang/master/OFL.txt" \
            --output "$FONT_DIR/OFL-GowunBatang.txt"
          test -s "$FONT_DIR/GowunBatang-Regular.ttf"
          test -s "$FONT_DIR/GowunBatang-Bold.ttf"
          test -s "$FONT_DIR/OFL-GowunBatang.txt"
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.soso.holdon;' "$PROJECT_FILE"
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.soso.holdon.controls;' "$PROJECT_FILE"
          grep -q 'PROVISIONING_PROFILE_SPECIFIER = HOLD_ON_APP_STORE_BUILD10;' "$PROJECT_FILE"
          grep -q 'PROVISIONING_PROFILE_SPECIFIER = HOLD_ON_CONTROLS_APP_STORE_BUILD10;' "$PROJECT_FILE"
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 160;' "$PROJECT_FILE")" -eq 4
          if grep -E 'CURRENT_PROJECT_VERSION = [0-9]+;' "$PROJECT_FILE" | grep -v 'CURRENT_PROJECT_VERSION = 160;' >/dev/null; then
            echo "ERROR: mismatched build number remains in project"
            exit 1
          fi
          test "$(grep -c 'MARKETING_VERSION = 1.0;' "$PROJECT_FILE")" -eq 4
          grep -q '@StateObject private var playbackCoordinator = MemoryPreviewPlaybackCoordinator()' "$CM_BUILD_DIR/HoldOnRebuild/Screens/MemoriesView.swift"
          grep -q '@EnvironmentObject private var playbackCoordinator: MemoryPreviewPlaybackCoordinator' "$CM_BUILD_DIR/HoldOnRebuild/Screens/MemoriesView.swift"
          if find "$CM_BUILD_DIR" -type f \( -name '*.html' -o -name '*.js' \) | grep -q .; then
            echo "ERROR: legacy HTML/JS found"
            exit 1
          fi
          echo "Native functional rebuild preflight passed."

      - name: Verify edited subtitle timing
        script: |
          set -euo pipefail
          swiftc "$CM_BUILD_DIR/HoldOnRebuild/Models/SavedMoment.swift" "$CM_BUILD_DIR/Validation/SubtitleTimingChecks.swift" -o /tmp/holdon-subtitle-checks
          /tmp/holdon-subtitle-checks

      - name: Verify Xcode project and scheme
        script: |
          set -euo pipefail
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -list

      - name: Set up iOS code signing
        script: |
          set -euo pipefail
          xcode-project use-profiles
          echo "=== Main target profile mapping ==="
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings | grep -E "PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_STYLE|CODE_SIGN_ENTITLEMENTS" || true
          echo "=== Installed provisioning profiles ==="
          ls -1 "$HOME/Library/MobileDevice/Provisioning Profiles" || true

      - name: Build signed IPA for TestFlight
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
